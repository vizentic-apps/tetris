server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

  location = /sw.js { expires -1; }
  location = /index.html { expires -1; }
  location = / { expires -1; }
  location ~ \.webmanifest$ { default_type application/manifest+json; expires 1h; }
  location /icons/ { expires 30d; }
  location / { try_files $uri =404; }
}
